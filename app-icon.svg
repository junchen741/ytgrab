<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3F45"/>
      <stop offset="1" stop-color="#1E2124"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#body)"/>
  <g fill="#7CF5D0" filter="url(#glow)">
    <polygon points="380,300 740,230 740,320 380,390"/>
    <rect x="380" y="330" width="56" height="380"/>
    <rect x="684" y="260" width="56" height="380"/>
